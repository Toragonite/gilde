<!doctype html>
<html lang="en">
<head>

<title>Gate self-test: broken</title>
<style>
  body { font: 14px/1.5 -apple-system, sans-serif; margin: 0; background: #ffffff; color: #1f1f1f; }
  .faint { color: #d4d4d4; }
  .cut { overflow: hidden; white-space: nowrap; width: 80px; }

  .cut-path { overflow: hidden; white-space: nowrap; width: 80px; clip-path: inset(0); }
  .row button { margin: 1px; }
</style>
</head>
<body>

<nav><a href="#b">two</a></nav>
<main>

  <p class="cut">A label that is cut without any ellipsis at all</p>
  <p class="cut-path">Another label that a clip-path box cuts without an ellipsis</p>
  <input type="text">
  <img src="data:image/gif;base64,R0lGODlhAQABAAAAACw=">
  <div class="row">
    <button>1</button><button>2</button><button>3</button><button>4</button><button>5</button>
    <button>6</button><button>7</button><button>8</button><button>9</button><button>10</button>
    <button>11</button><button>12</button><button>13</button><button>14</button><button>15</button>
    <button>16</button><button>17</button><button>18</button>
  </div>
  <div aria-live="assertive"></div>
  <div aria-live="assertive"></div>
  <div role="dialog" aria-label="New session"><button>Start</button></div>
  <button id="after">Outside the dialog</button>
</main>
<script>
  window.__flOverlaps = () => ['label "alpha" @10,10+40x12 × bubble @30,8+60x20'];

</script>
</body>
</html>
